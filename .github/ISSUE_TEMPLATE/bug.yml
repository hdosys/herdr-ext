name: Bug report
description: Report a reproducible problem in a Herdr Extended snapshot.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        **Before you start:** Read [CONTRIBUTING.md](https://github.com/hdosys/herdr-ext/blob/master/CONTRIBUTING.md).

        Use this form for a problem observed in a Herdr Extended Windows snapshot. If practical, try the same workflow with upstream Herdr and report the result below. Do not report a distribution-only failure to upstream.

        Keep the report factual and include only the smallest relevant logs. For general Herdr questions and product feature requests, use the upstream project links shown on the new-issue page.

  - type: checkboxes
    id: bug-confirmation
    attributes:
      label: Is this a reproducible bug?
      description: Confirm that the problem occurs in a Herdr Extended snapshot and has exact reproduction steps.
      options:
        - label: I confirm this is a reproducible Herdr Extended bug, not a general Herdr question or feature request.
          required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What is happening now? Describe what you observed, not a guessed cause.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: What are the shortest exact steps or commands that show the problem?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How does this affect you?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Copy the release tag and upstream revision from the Herdr Extended release notes.
      value: |
        - Herdr Extended release tag:
        - Upstream revision:
        - Windows version:
        - Terminal:
        - Shell:
        - Result with upstream Herdr (same, not present, or not tested):
        - Relevant config, if any:
    validations:
      required: true
