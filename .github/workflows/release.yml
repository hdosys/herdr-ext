name: Build and promote Herdr Extended release

run-name: >-
  ${{ inputs.operation == 'build'
      && format('Build Herdr Extended v{0}', inputs.release_version)
      || format('Promote Herdr Extended build {0}', inputs.build_run_id) }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Build a candidate or promote a successful build run"
        required: true
        default: build
        type: choice
        options:
          - build
          - promote
      release_version:
        description: "Build only: Herdr Extended CalVer without v (YYYY.MM.DD.N)"
        required: false
        type: string
      build_run_id:
        description: "Promote only: successful build workflow run ID"
        required: false
        type: string

concurrency:
  group: herdr-win-manual-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Replay, test, and package Windows
    if: inputs.operation == 'build'
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      upstream_sha: ${{ steps.source.outputs.upstream_sha }}
      control_sha: ${{ steps.source.outputs.control_sha }}
      build_id: ${{ steps.source.outputs.build_id }}
      replay_tree: ${{ steps.replay.outputs.replay_tree }}
      base_version: ${{ steps.replay.outputs.base_version }}
      protocol: ${{ steps.replay.outputs.protocol }}
      release_version: ${{ steps.release_identity.outputs.release_version }}
      asset_names_json: ${{ steps.release_identity.outputs.asset_names_json }}
      artifact_name: ${{ steps.release_identity.outputs.artifact_name }}
      archive_asset_name: ${{ steps.release_identity.outputs.archive_asset_name }}
      installer_asset_name: ${{ steps.release_identity.outputs.installer_asset_name }}
    steps:
      - name: Checkout Herdr Extended control repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: control
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity
        id: release_identity
        shell: pwsh
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
          BUILD_RUN_ID_INPUT: ${{ inputs.build_run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not [string]::IsNullOrEmpty($env:BUILD_RUN_ID_INPUT)) {
            throw "Candidate builds do not accept a promotion build run ID"
          }
          $releaseVersion = $env:RELEASE_VERSION_INPUT.Trim()
          $assetJson = & python control\scripts\preview.py herdr-ext-asset-names `
            --release-version $releaseVersion
          if ($LASTEXITCODE -ne 0) {
            throw "invalid Herdr Extended release version '$releaseVersion'"
          }
          $assets = $assetJson | ConvertFrom-Json
          $archiveAssetName = [string] $assets.'windows-x86_64'
          $installerAssetName = [string] $assets.'windows-x86_64-installer'
          $artifactName = [IO.Path]::GetFileNameWithoutExtension($archiveAssetName)
          if ($archiveAssetName -cne "$artifactName.zip") {
            throw "portable archive name is not a ZIP: $archiveAssetName"
          }
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "asset_names_json=$assetJson" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "archive_asset_name=$archiveAssetName" >> $env:GITHUB_OUTPUT
          "installer_asset_name=$installerAssetName" >> $env:GITHUB_OUTPUT
          "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV
          "ARTIFACT_NAME=$artifactName" >> $env:GITHUB_ENV
          "INSTALLER_ASSET_NAME=$installerAssetName" >> $env:GITHUB_ENV

      - name: Select reviewed upstream source
        id: upstream_source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $basePath = Join-Path $PWD "control\patches\delta\BASE"
          $upstreamRef = [IO.File]::ReadAllText($basePath).Trim()
          if ($upstreamRef -cnotmatch '^[0-9a-f]{40}$') {
            throw "patches/delta/BASE must contain one full lowercase commit"
          }
          "ref=$upstreamRef" >> $env:GITHUB_OUTPUT

      - name: Checkout upstream Herdr
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: herdrdev/herdr
          ref: ${{ steps.upstream_source.outputs.ref }}
          path: source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Record immutable source identity
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -ne "refs/heads/master") {
            throw "Candidate builds must run from master, not $env:GITHUB_REF"
          }
          $upstream = (git -C source rev-parse HEAD).Trim()
          Push-Location control
          try {
            $controlHead = (git rev-parse HEAD).Trim()
            $control = $controlHead
            $hiddenPrefixes = @(
              "docs: update website manifest",
              "docs: update preview manifest",
              "chore: approve contributor",
              "chore: approve merged contributor"
            )
            while ($true) {
              $subject = (git show -s --format=%s $control).Trim().ToLowerInvariant()
              $hidden = $false
              foreach ($prefix in $hiddenPrefixes) {
                if ($subject.StartsWith($prefix, [StringComparison]::Ordinal)) {
                  $hidden = $true
                  break
                }
              }
              if (-not $hidden) {
                break
              }
              $commitPaths = @(git diff-tree --no-commit-id --name-only -r $control)
              if ($LASTEXITCODE -ne 0 -or $commitPaths.Count -ne 1 -or $commitPaths[0] -ne "website/preview.json") {
                throw "hidden commit $control changed files outside website/preview.json"
              }
              $control = (git rev-parse "${control}^").Trim()
            }
            if ($control -notmatch '^[0-9a-f]{40}$') {
              throw "failed to select immutable Herdr Extended control revision"
            }
            & git checkout --detach $control
            if ($LASTEXITCODE -ne 0) {
              throw "failed to check out selected control revision $control"
            }
            $selected = (python scripts\preview.py select-commit --ref $controlHead).Trim()
            if ($LASTEXITCODE -ne 0 -or $selected -ne $control) {
              throw "tested preview selector disagrees with validated control revision $control"
            }
            $buildId = (python scripts\preview.py candidate-build-id `
              --upstream-sha $upstream `
              --control-sha $control `
              --run-id $env:GITHUB_RUN_ID `
              --run-attempt $env:GITHUB_RUN_ATTEMPT).Trim()
            if ($LASTEXITCODE -ne 0 -or $buildId -cnotmatch '^[0-9a-f]{12}\.[0-9a-f]{12}$') {
              throw "failed to derive candidate-scoped build identity"
            }
          } finally {
            Pop-Location
          }
          "upstream_sha=$upstream" >> $env:GITHUB_OUTPUT
          "control_sha=$control" >> $env:GITHUB_OUTPUT
          "build_id=$buildId" >> $env:GITHUB_OUTPUT
          "HERDR_BUILD_ID=$buildId" >> $env:GITHUB_ENV
          "HERDR_BUILD_COMMIT=$upstream" >> $env:GITHUB_ENV

      - name: Validate and replay maintained delta
        id: replay
        shell: pwsh
        env:
          GIT_COMMITTER_NAME: Herdr Extended replay
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          $ErrorActionPreference = "Stop"
          $base = (git -C ..\source rev-parse HEAD).Trim()
          python -m unittest scripts.test_delta_patches scripts.test_upstream_patches
          if ($LASTEXITCODE -ne 0) {
            throw "patch inventory validation failed with exit code $LASTEXITCODE"
          }
          $entries = @(
            Get-Content -LiteralPath patches\delta\series |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith("#") }
          )
          foreach ($entry in $entries) {
            $patch = (Resolve-Path -LiteralPath (Join-Path "patches\delta" $entry)).Path
            & git -C ..\source am --3way $patch
            if ($LASTEXITCODE -ne 0) {
              & git -C ..\source am --abort 2>$null
              throw "failed to replay $entry on selected upstream source $base"
            }
          }
          & git -C ..\source diff --check "$base..HEAD"
          if ($LASTEXITCODE -ne 0) {
            throw "replayed delta failed git diff --check"
          }
          $distribution = Get-Content -LiteralPath ..\source\src\distribution.rs -Raw
          function Get-DistributionUrl([string] $name) {
            $pattern = '(?s)\bconst\s+' + [regex]::Escape($name) + ':\s*&str\s*=\s*"([^"]+)";'
            $match = [regex]::Match($distribution, $pattern)
            if (-not $match.Success) {
              throw "could not read $name from replayed distribution configuration"
            }
            $match.Groups[1].Value
          }
          $manifestUrl = Get-DistributionUrl "PREVIEW_MANIFEST_URL"
          $expectedManifestUrl = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/master/website/preview.json"
          if ($manifestUrl -cne $expectedManifestUrl) {
            throw "replayed distribution manifest URL is not fork-owned"
          }
          $releasePrefix = Get-DistributionUrl "RELEASE_DOWNLOAD_PREFIX"
          $expectedReleasePrefix = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/"
          if ($releasePrefix -cne $expectedReleasePrefix) {
            throw "replayed Windows release prefix is not the immutable fork release owner"
          }
          $cargoToml = Get-Content -LiteralPath ..\source\Cargo.toml -Raw
          if ($cargoToml -notmatch '(?m)^version = "([0-9]+\.[0-9]+\.[0-9]+)"\r?$') {
            throw "could not read replayed Cargo package version"
          }
          $baseVersion = $Matches[1]
          $stableTag = "v$baseVersion"
          $tagCommit = (& git -C ..\source rev-list -n 1 $stableTag).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $base) {
            throw "recorded BASE $base is not upstream stable release $stableTag"
          }
          "HERDR_BASE_VERSION=$baseVersion" >> $env:GITHUB_ENV
          "HERDR_UPSTREAM_RELEASE=$stableTag" >> $env:GITHUB_ENV
          $wire = Get-Content -LiteralPath ..\source\src\protocol\wire.rs -Raw
          if ($wire -notmatch 'pub const PROTOCOL_VERSION: u32 = ([0-9]+);') {
            throw "could not read replayed wire protocol version"
          }
          "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
          "protocol=$($Matches[1])" >> $env:GITHUB_OUTPUT
          $endpointGeneration = & python ..\source\scripts\preview.py endpoint-generation `
            --source ..\source\src\protocol\endpoint.rs
          if ($LASTEXITCODE -ne 0) {
            throw "could not read replayed endpoint protocol generation"
          }
          "endpoint_generation=$endpointGeneration" >> $env:GITHUB_OUTPUT
          $replaySha = (git -C ..\source rev-parse HEAD).Trim()
          $replayTree = (git -C ..\source rev-parse 'HEAD^{tree}').Trim()
          "HERDR_REPLAY_SHA=$replaySha" >> $env:GITHUB_ENV
          "replay_tree=$replayTree" >> $env:GITHUB_OUTPUT
        working-directory: control

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.15.2

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: herdr-win-windows-release
          workspaces: source

      - name: Run Windows checks
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest scripts.test_package_windows_conpty
          python -m unittest `
            scripts.test_preview.PreviewNotesTests.test_build_manifest_archives_current_assets `
            scripts.test_preview.PreviewNotesTests.test_endpoint_generation_reads_source_and_rejects_invalid_u32 `
            scripts.test_preview.PreviewNotesTests.test_manifest_rejects_invalid_endpoint_generation `
            scripts.test_preview.PreviewNotesTests.test_preview_assets_require_sha256 `
            scripts.test_preview.PreviewNotesTests.test_manifest_preserves_legacy_zip_only_archived_build `
            scripts.test_preview.PreviewNotesTests.test_manifest_build_id_uses_two_hex_components
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr-launcher
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr published_cli_version_leads_with_calver
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr local_cli_version_retains_build_provenance
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr runtime_identity_separates_release_order_from_exact_build
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr published_release_rejects_prerelease_and_non_newer_calver
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr client_status_separates_release_compatibility_and_build_identity
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr release_calver_controls_update_ready_state
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr winget_catalog
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr herdr_win_release_version
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr remote::attach::tests
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr raw_input::tests
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr client::input
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr host_color
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr pane::cursor::tests
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr cursor_color
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr terminal_restore_postlude
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr host_theme_update_preserves_cursor
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr host_terminal_theme_restore_probe
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr restore_host_terminal_theme
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr render_ansi::tests
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr app_theme_
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr client_input_events_roundtrip

      - name: Build release executable
        working-directory: source
        env:
          HERDR_RELEASE_VERSION: ${{ steps.release_identity.outputs.release_version }}
        run: cargo build --release --locked --target ${{ env.WINDOWS_TARGET }} --bins

      - name: Verify self-contained Windows executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe is unavailable"
          }
          $dumpbin = @(& $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe") |
            Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($dumpbin) -or
              -not (Test-Path -LiteralPath $dumpbin -PathType Leaf)) {
            throw "dumpbin.exe is unavailable"
          }
          $pattern = '(?im)^\s*(?:VCRUNTIME|MSVCP)[A-Z0-9_]*\.dll\s*$'
          foreach ($name in @("herdr.exe", "herdr-launcher.exe", "herdr-installer-helper.exe")) {
            $path = Join-Path $PWD "source\target\$env:WINDOWS_TARGET\release\$name"
            $dependencies = (& $dumpbin /DEPENDENTS $path | Out-String)
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed for $path"
            }
            if ($dependencies -match $pattern) {
              throw "$name requires a non-inbox MSVC runtime: $($Matches[0].Trim())"
            }
          }

      - name: Verify system ConPTY fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "source\target\$env:WINDOWS_TARGET\release\herdr.exe"
          .\source\scripts\windows_smoke_conpty_path.ps1 `
            -ExePath $exe `
            -Session "release-system-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

      - name: Package and validate release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactRoot = Join-Path $PWD "artifact"
          $stage = Join-Path $env:RUNNER_TEMP $env:ARTIFACT_NAME
          $archive = Join-Path $artifactRoot "$($env:ARTIFACT_NAME).zip"
          $installer = Join-Path $artifactRoot $env:INSTALLER_ASSET_NAME
          $faultRoot = Join-Path $env:RUNNER_TEMP "herdr-installer-faults"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $exe = Join-Path $PWD "source\target\$env:WINDOWS_TARGET\release\herdr.exe"
          $launcher = Join-Path $PWD "source\target\$env:WINDOWS_TARGET\release\herdr-launcher.exe"
          $installerHelper = Join-Path $PWD "source\target\$env:WINDOWS_TARGET\release\herdr-installer-helper.exe"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          function Stop-BoundedProcessTree {
            param([Parameter(Mandatory = $true)][Diagnostics.Process] $Process)
            $descendants = [Collections.Generic.List[Diagnostics.Process]]::new()
            $snapshotError = $null
            try {
              $entries = @(Get-CimInstance Win32_Process -Property ProcessId, ParentProcessId -OperationTimeoutSec 5)
              $seen = [Collections.Generic.HashSet[uint32]]::new()
              $pending = [Collections.Generic.Queue[uint32]]::new()
              [void] $seen.Add([uint32] $Process.Id)
              $pending.Enqueue([uint32] $Process.Id)
              while ($pending.Count -gt 0) {
                $parent = $pending.Dequeue()
                foreach ($entry in $entries) {
                  $childProcessId = [uint32] $entry.ProcessId
                  if ([uint32] $entry.ParentProcessId -eq $parent -and $seen.Add($childProcessId)) {
                    $pending.Enqueue($childProcessId)
                    try {
                      $descendant = [Diagnostics.Process]::GetProcessById([int] $childProcessId)
                      [void] $descendant.Handle
                      $descendants.Add($descendant)
                    } catch {
                      # The descendant already reached terminal state.
                    }
                  }
                }
              }
            } catch {
              $snapshotError = $_
            }
            $taskkill = Join-Path $env:SystemRoot "System32\taskkill.exe"
            $taskkillFailed = $false
            $cleanup = Start-Process -FilePath $taskkill -ArgumentList @("/PID", $Process.Id, "/T", "/F") -PassThru -NoNewWindow
            try {
              if (-not $cleanup.WaitForExit(10000)) {
                $cleanup.Kill()
                [void] $cleanup.WaitForExit(5000)
                $taskkillFailed = $true
              } elseif ($cleanup.ExitCode -ne 0) {
                $taskkillFailed = $true
              }
            } finally {
              $cleanup.Dispose()
            }
            $owned = @($Process) + @($descendants)
            try {
              foreach ($ownedProcess in $owned) {
                if (-not $ownedProcess.HasExited) {
                  try {
                    $ownedProcess.Kill($true)
                  } catch {
                    if (-not $ownedProcess.HasExited) {
                      throw
                    }
                  }
                }
              }
              $timer = [Diagnostics.Stopwatch]::StartNew()
              foreach ($ownedProcess in $owned) {
                $remaining = 10000 - [int] $timer.ElapsedMilliseconds
                if ($remaining -le 0 -or -not $ownedProcess.WaitForExit($remaining)) {
                  throw "owned process tree did not terminate within its 10000 ms confirmation deadline"
                }
              }
            } finally {
              foreach ($descendant in $descendants) {
                $descendant.Dispose()
              }
            }
            if ($null -ne $snapshotError) {
              throw "could not snapshot the owned process tree before cleanup: $snapshotError"
            }
            if ($taskkillFailed) {
              Write-Warning "taskkill did not complete cleanly; the captured process tree required bounded fallback cleanup"
            }
          }

          function Invoke-BoundedProcess {
            param(
              [Parameter(Mandatory = $true)][string] $FilePath,
              [Parameter(Mandatory = $true)][string[]] $Arguments,
              [Parameter(Mandatory = $true)][int] $TimeoutMilliseconds
            )
            $startInfo = [Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $FilePath
            $startInfo.UseShellExecute = $false
            foreach ($argument in $Arguments) {
              [void] $startInfo.ArgumentList.Add($argument)
            }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            try {
              if (-not $process.Start()) {
                throw "could not start $FilePath"
              }
              if (-not $process.WaitForExit($TimeoutMilliseconds)) {
                Stop-BoundedProcessTree -Process $process
                throw "$FilePath exceeded its $TimeoutMilliseconds ms process deadline"
              }
              if ($process.ExitCode -ne 0) {
                throw "$FilePath failed with exit code $($process.ExitCode)"
              }
            } finally {
              $process.Dispose()
            }
          }

          $binary = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($exe))
          $distribution = Get-Content -LiteralPath source\src\distribution.rs -Raw
          $requiredUrls = [regex]::Matches(
            $distribution,
            '(?s)\bconst\s+(?:PREVIEW_MANIFEST_URL|RELEASE_DOWNLOAD_PREFIX):\s*&str\s*=\s*"([^"]+)";'
          ) | ForEach-Object { $_.Groups[1].Value }
          if ($requiredUrls.Count -ne 2) {
            throw "could not read required fork URLs from distribution configuration"
          }
          foreach ($url in $requiredUrls) {
            if (-not $binary.Contains($url)) {
              throw "release executable does not contain required fork update URL: $url"
            }
          }
          foreach ($url in @(
            "https://herdr.dev/latest.json",
            "https://herdr.dev/preview.json",
            "https://herdr.dev/install.ps1"
          )) {
            if ($binary.Contains($url)) {
              throw "release executable contains forbidden upstream update URL: $url"
            }
          }

          .\source\scripts\package_windows_conpty.ps1 `
            -HerdrExe $exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath $archive
          Invoke-BoundedProcess -FilePath "powershell.exe" -TimeoutMilliseconds 180000 -Arguments @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
            (Join-Path $PWD "source\scripts\windows_install_conpty_package_test.ps1"),
            "-ArchivePath", $archive
          )

          Invoke-BoundedProcess -FilePath "powershell.exe" -TimeoutMilliseconds 300000 -Arguments @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
            (Join-Path $PWD "source\scripts\package_windows_installer.ps1"),
            "-StageDir", $stage,
            "-LauncherExe", $launcher,
            "-InstallerHelperExe", $installerHelper,
            "-BuildId", $env:HERDR_BUILD_ID,
            "-ReleaseVersion", $env:RELEASE_VERSION,
            "-BaseVersion", $env:HERDR_BASE_VERSION,
            "-OutputPath", $installer
          )
          Invoke-BoundedProcess -FilePath "powershell.exe" -TimeoutMilliseconds 1200000 -Arguments @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
            (Join-Path $PWD "source\scripts\windows_installer_fault_test.ps1"),
            "-StageDir", $stage,
            "-LauncherExe", $launcher,
            "-InstallerHelperExe", $installerHelper,
            "-BuildId", $env:HERDR_BUILD_ID,
            "-ReleaseVersion", $env:RELEASE_VERSION,
            "-BaseVersion", $env:HERDR_BASE_VERSION,
            "-OutputDir", $faultRoot
          )

          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$hash  $($env:ARTIFACT_NAME).zip`n"
          [IO.File]::WriteAllText("$archive.sha256", $checksum, [Text.UTF8Encoding]::new($false))
          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerChecksum = "$installerHash  $env:INSTALLER_ASSET_NAME`n"
          [IO.File]::WriteAllText("$installer.sha256", $installerChecksum, [Text.UTF8Encoding]::new($false))
          $sourceHead = (git -C source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceHead -ne $env:HERDR_REPLAY_SHA) {
            throw "replayed source identity changed during build"
          }
          $trackedChanges = @(git -C source status --short --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $trackedChanges.Count -ne 0) {
            throw "build modified tracked replay source: $($trackedChanges -join ', ')"
          }
          & git -C source diff --quiet HEAD -- scripts/preview.py
          if ($LASTEXITCODE -ne 0) {
            throw "tested preview generator differs from replay HEAD"
          }
          Copy-Item -LiteralPath control\patches\delta\series -Destination (Join-Path $artifactRoot "PATCH_SERIES.txt")
          $sourceGeneratorBlob = (& git -C source rev-parse "HEAD:scripts/preview.py").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "could not resolve replayed preview generator blob"
          }
          $controlGeneratorBlob = (& git -C control rev-parse "HEAD:scripts/preview.py").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "could not resolve control preview generator blob"
          }
          if ($sourceGeneratorBlob -cne $controlGeneratorBlob) {
            throw "replayed preview generator differs from the selected control revision"
          }

      - name: Record immutable release candidate metadata
        shell: pwsh
        env:
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
          CONTROL_SHA: ${{ steps.source.outputs.control_sha }}
          BUILD_ID: ${{ steps.source.outputs.build_id }}
          REPLAY_TREE: ${{ steps.replay.outputs.replay_tree }}
          BASE_VERSION: ${{ steps.replay.outputs.base_version }}
          PROTOCOL: ${{ steps.replay.outputs.protocol }}
          ENDPOINT_GENERATION: ${{ steps.replay.outputs.endpoint_generation }}
          RELEASE_VERSION: ${{ steps.release_identity.outputs.release_version }}
          ASSET_NAMES_JSON: ${{ steps.release_identity.outputs.asset_names_json }}
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = [ordered]@{
            schema_version = 1
            repository = $env:GITHUB_REPOSITORY
            workflow = ".github/workflows/release.yml"
            operation = "build"
            workflow_run_id = [long] $env:GITHUB_RUN_ID
            workflow_run_attempt = [int] $env:GITHUB_RUN_ATTEMPT
            workflow_sha = $env:GITHUB_SHA
            upstream_sha = $env:UPSTREAM_SHA
            control_sha = $env:CONTROL_SHA
            replay_tree = $env:REPLAY_TREE
            build_id = $env:BUILD_ID
            base_version = $env:BASE_VERSION
            protocol = [int] $env:PROTOCOL
            endpoint_generation = [uint32] $env:ENDPOINT_GENERATION
            release_version = $env:RELEASE_VERSION
            asset_names = ($env:ASSET_NAMES_JSON | ConvertFrom-Json)
          }
          $path = Join-Path $PWD "artifact\RELEASE_CANDIDATE.json"
          $json = $metadata | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText($path, "$json`n", [Text.UTF8Encoding]::new($false))
          $roundTrip = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ([long] $roundTrip.workflow_run_id -ne [long] $env:GITHUB_RUN_ID -or
              [string] $roundTrip.build_id -cne $env:BUILD_ID -or
              [uint32] $roundTrip.endpoint_generation -ne [uint32] $env:ENDPOINT_GENERATION -or
              [string] $roundTrip.release_version -cne $env:RELEASE_VERSION) {
            throw "release candidate metadata did not round-trip exactly"
          }
          @(
            "## Release candidate ready after this workflow succeeds"
            ""
            "Promote build run ID ``$env:GITHUB_RUN_ID`` from the **Build and promote Herdr Extended release** workflow."
            "Candidate artifacts are retained for 14 days."
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload tested package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-win-candidate-windows-${{ github.run_id }}
          path: |
            artifact/${{ steps.release_identity.outputs.archive_asset_name }}
            artifact/${{ steps.release_identity.outputs.archive_asset_name }}.sha256
            artifact/${{ steps.release_identity.outputs.installer_asset_name }}
            artifact/${{ steps.release_identity.outputs.installer_asset_name }}.sha256
            artifact/PATCH_SERIES.txt
            artifact/RELEASE_CANDIDATE.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  build-portable:
    name: Build ${{ matrix.asset_key }}
    needs: build
    if: inputs.operation == 'build'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_key: linux-x86_64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            file_arch: x86-64
          - asset_key: linux-aarch64
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            file_arch: ARM aarch64
          - asset_key: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-latest
            file_arch: x86_64
          - asset_key: macos-aarch64
            target: aarch64-apple-darwin
            os: macos-latest
            file_arch: arm64
    env:
      HERDR_BUILD_ID: ${{ needs.build.outputs.build_id }}
      HERDR_BUILD_COMMIT: ${{ needs.build.outputs.upstream_sha }}
      HERDR_REPLAY_TREE: ${{ needs.build.outputs.replay_tree }}
      HERDR_RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: "true"
    steps:
      - name: Checkout tested Herdr Extended control revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: control
          ref: ${{ needs.build.outputs.control_sha }}
          persist-credentials: false

      - name: Checkout tested upstream source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: herdrdev/herdr
          path: source
          ref: ${{ needs.build.outputs.upstream_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select release asset name
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          asset_json="$(python3 control/scripts/preview.py herdr-ext-asset-names \
            --release-version "$RELEASE_VERSION")"
          asset_name="$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)[sys.argv[1]])' \
            '${{ matrix.asset_key }}' <<<"$asset_json")"
          case "$asset_name" in
            "herdr-ext_v${RELEASE_VERSION}_"*) ;;
            *)
              echo "Invalid release asset name: ${asset_name}" >&2
              exit 1
              ;;
          esac
          echo "name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "ASSET_NAME=$asset_name" >> "$GITHUB_ENV"

      - name: Replay the tested maintained delta
        working-directory: control
        shell: bash
        env:
          GIT_COMMITTER_NAME: Herdr Extended replay
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          base="$(git -C ../source rev-parse HEAD)"
          if [[ "$base" != '${{ needs.build.outputs.upstream_sha }}' ]]; then
            echo "Portable build checked out unexpected upstream source ${base}." >&2
            exit 1
          fi
          while IFS= read -r patch; do
            patch="${patch%$'\r'}"
            [[ -z "$patch" || "$patch" == \#* ]] && continue
            if ! git -C ../source am --3way "$PWD/patches/delta/$patch"; then
              git -C ../source am --abort 2>/dev/null || true
              echo "Failed to replay ${patch} for ${{ matrix.asset_key }}." >&2
              exit 1
            fi
          done < patches/delta/series
          git -C ../source diff --check "$base..HEAD"
          replay_tree="$(git -C ../source rev-parse 'HEAD^{tree}')"
          if [[ "$replay_tree" != "$HERDR_REPLAY_TREE" ]]; then
            echo "Portable replay tree ${replay_tree} differs from tested Windows tree ${HERDR_REPLAY_TREE}." >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.15.2

      - name: Restore Homebrew Zig cache
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.15-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.15-${{ runner.os }}-

      - name: Install patched Zig on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -type f \
            \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: herdr-win-release-${{ matrix.target }}
          workspaces: source

      - name: Build release executable
        working-directory: source
        run: cargo build --release --locked --target ${{ matrix.target }} --bin herdr

      - name: Package and validate executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          executable="artifact/${ASSET_NAME}"
          cp "source/target/${{ matrix.target }}/release/herdr" "$executable"
          chmod 755 "$executable"
          file_output="$(file "$executable")"
          echo "$file_output"
          if [[ "$file_output" != *'${{ matrix.file_arch }}'* ]]; then
            echo "Unexpected machine type for ${ASSET_NAME}: ${file_output}" >&2
            exit 1
          fi
          if [[ '${{ runner.os }}' == 'Linux' ]]; then
            ldd_output="$(ldd "$executable" 2>&1 || true)"
            echo "$ldd_output"
            if ! grep -Eq 'statically linked|not a dynamic executable' <<<"$ldd_output"; then
              echo "Linux release executable is not statically linked." >&2
              exit 1
            fi
            if nm -u "$executable" 2>/dev/null | grep -E '(__cxa|GLIBCXX|CXXABI|_ZSt)'; then
              echo "Linux release executable has unresolved C++ runtime symbols." >&2
              exit 1
            fi
          fi
          python3 - "$executable" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          path.with_name(path.name + ".sha256").write_text(
              f"{digest}  {path.name}\n", encoding="ascii"
          )
          PY
          replay_tree="$(git -C source rev-parse 'HEAD^{tree}')"
          if [[ "$replay_tree" != "$HERDR_REPLAY_TREE" ]]; then
            echo "Replayed source tree changed during the portable build." >&2
            exit 1
          fi
          tracked_changes="$(git -C source status --short --untracked-files=no)"
          if [[ -n "$tracked_changes" ]]; then
            echo "Portable build modified tracked replay source:" >&2
            echo "$tracked_changes" >&2
            exit 1
          fi

      - name: Upload tested executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-win-portable-${{ matrix.asset_key }}-${{ github.run_id }}
          path: |
            artifact/${{ steps.asset.outputs.name }}
            artifact/${{ steps.asset.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  publish:
    name: Publish immutable cross-platform stable release
    if: inputs.operation == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build_id: ${{ steps.candidate.outputs.build_id }}
      base_version: ${{ steps.candidate.outputs.base_version }}
      release_version: ${{ steps.candidate.outputs.release_version }}
      asset_names_json: ${{ steps.candidate.outputs.asset_names_json }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      installer_asset_name: ${{ steps.candidate.outputs.installer_asset_name }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require immutable release policy
        shell: bash
        env:
          RELEASE_IMMUTABILITY_ATTESTED: ${{ vars.HERDR_RELEASE_IMMUTABILITY_ENABLED }}
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Release promotion must run from master, not ${GITHUB_REF}." >&2
            exit 1
          fi
          if [[ -n "$RELEASE_VERSION_INPUT" ]]; then
            echo "Release promotion does not accept a CalVer override; select a candidate build run ID." >&2
            exit 1
          fi
          if [[ "$RELEASE_IMMUTABILITY_ATTESTED" != "true" ]]; then
            echo "HERDR_RELEASE_IMMUTABILITY_ENABLED must attest that repository release immutability is enabled." >&2
            exit 1
          fi

      - name: Validate selected successful build run
        id: build_run
        shell: bash
        env:
          BUILD_RUN_ID_INPUT: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_run_id="$BUILD_RUN_ID_INPUT"
          if [[ ! "$build_run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Promotion requires a positive build workflow run ID." >&2
            exit 1
          fi
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${build_run_id}")"
          jq -e \
            --argjson run_id "$build_run_id" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg workflow ".github/workflows/release.yml" \
            '.id == $run_id
             and .repository.full_name == $repo
             and .path == $workflow
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "master"
             and (.head_sha | test("^[0-9a-f]{40}$"))
             and ((.run_attempt | type) == "number")
             and (.run_attempt >= 1)' \
            <<<"$run_json" >/dev/null
          echo "run_id=$build_run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$(jq -r .run_attempt <<<"$run_json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r .head_sha <<<"$run_json")" >> "$GITHUB_OUTPUT"

      - name: Checkout manifest owner
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: master
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Download selected Windows candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: herdr-win-candidate-windows-${{ steps.build_run.outputs.run_id }}
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.build_run.outputs.run_id }}

      - name: Download selected portable candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: herdr-win-portable-*-${{ steps.build_run.outputs.run_id }}
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.build_run.outputs.run_id }}

      - name: Validate immutable release candidate
        id: candidate
        shell: bash
        env:
          BUILD_RUN_ID: ${{ steps.build_run.outputs.run_id }}
          BUILD_RUN_ATTEMPT: ${{ steps.build_run.outputs.run_attempt }}
          BUILD_HEAD_SHA: ${{ steps.build_run.outputs.head_sha }}
        run: |
          set -euo pipefail
          metadata="release-assets/RELEASE_CANDIDATE.json"
          if [[ ! -f "$metadata" ]]; then
            echo "Selected build has no release candidate metadata." >&2
            exit 1
          fi
          asset_keys='["linux-aarch64","linux-x86_64","macos-aarch64","macos-x86_64","windows-x86_64","windows-x86_64-installer"]'
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg workflow ".github/workflows/release.yml" \
            --argjson run_id "$BUILD_RUN_ID" \
            --argjson run_attempt "$BUILD_RUN_ATTEMPT" \
            --arg workflow_sha "$BUILD_HEAD_SHA" \
            --argjson asset_keys "$asset_keys" \
            '.schema_version == 1
             and .repository == $repo
             and .workflow == $workflow
             and .operation == "build"
             and .workflow_run_id == $run_id
             and ((.workflow_run_attempt | type) == "number")
             and (.workflow_run_attempt >= 1)
             and (.workflow_run_attempt <= $run_attempt)
             and .workflow_sha == $workflow_sha
             and (.upstream_sha | test("^[0-9a-f]{40}$"))
             and (.control_sha | test("^[0-9a-f]{40}$"))
             and (.replay_tree | test("^[0-9a-f]{40}$"))
             and (.build_id | test("^[0-9a-f]{12}\\.[0-9a-f]{12}$"))
             and (.base_version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
             and ((.protocol | type) == "number")
             and (.protocol >= 0)
             and ((.protocol | floor) == .protocol)
             and ((.endpoint_generation | type) == "number")
             and (.endpoint_generation >= 1)
             and (.endpoint_generation <= 4294967295)
             and ((.endpoint_generation | floor) == .endpoint_generation)
             and (.release_version | test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[1-9][0-9]*$"))
             and ((.asset_names | type) == "object")
             and (.asset_names | keys) == $asset_keys
             and ([.asset_names[] | ((type == "string") and (length > 0))] | all)' \
            "$metadata" >/dev/null

          release_version="$(jq -er .release_version "$metadata")"
          python3 control/scripts/preview.py require-newer-herdr-win-release \
            --release-version "$release_version" \
            --manifest control/website/preview.json
          asset_names_json="$(jq -cS .asset_names "$metadata")"
          expected_names="$(python3 control/scripts/preview.py herdr-ext-asset-names \
            --release-version "$release_version" | jq -cS .)"
          if [[ "$asset_names_json" != "$expected_names" ]]; then
            echo "Candidate asset names do not match the tested compatibility naming owner." >&2
            exit 1
          fi

          upstream_sha="$(jq -er .upstream_sha "$metadata")"
          control_sha="$(jq -er .control_sha "$metadata")"
          build_id="$(jq -er .build_id "$metadata")"
          candidate_attempt="$(jq -er '.workflow_run_attempt | tostring' "$metadata")"
          replay_tree="$(jq -er .replay_tree "$metadata")"
          base_version="$(jq -er .base_version "$metadata")"
          protocol="$(jq -er .protocol "$metadata")"
          endpoint_generation="$(jq -er .endpoint_generation "$metadata")"
          portable_keys=(linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64)
          zip="$(jq -er '.asset_names["windows-x86_64"]' "$metadata")"
          installer="$(jq -er '.asset_names["windows-x86_64-installer"]' "$metadata")"
          artifact_name="${zip%.zip}"
          if [[ "$zip" != "${artifact_name}.zip" ]]; then
            echo "Candidate Windows archive is not a ZIP." >&2
            exit 1
          fi
          expected_files=(
            PATCH_SERIES.txt
            RELEASE_CANDIDATE.json
            "$zip"
            "${zip}.sha256"
            "$installer"
            "${installer}.sha256"
          )
          for key in "${portable_keys[@]}"; do
            asset="$(jq -er --arg key "$key" '.asset_names[$key]' "$metadata")"
            if [[ "$asset" == */* || "$asset" == *\\* || "$asset" == .* ]]; then
              echo "Invalid candidate asset name for ${key}: ${asset}" >&2
              exit 1
            fi
            expected_files+=("$asset" "${asset}.sha256")
          done
          if find release-assets -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "Candidate download contains an unexpected directory or special file." >&2
            exit 1
          fi
          expected_list="$(printf '%s\n' "${expected_files[@]}" | sort)"
          actual_list="$(find release-assets -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "$actual_list" != "$expected_list" ]]; then
            echo "Candidate file set is incomplete or contains unexpected files." >&2
            diff -u <(printf '%s\n' "$expected_list") <(printf '%s\n' "$actual_list") || true
            exit 1
          fi
          (
            cd release-assets
            sha256sum --check "${zip}.sha256"
            sha256sum --check "${installer}.sha256"
            for key in "${portable_keys[@]}"; do
              asset="$(jq -er --arg key "$key" '.asset_names[$key]' RELEASE_CANDIDATE.json)"
              sha256sum --check "${asset}.sha256"
            done
          )

          git -C control fetch --no-tags origin master
          if ! git -C control merge-base --is-ancestor "$control_sha" origin/master; then
            echo "Candidate control revision ${control_sha} is no longer on master." >&2
            exit 1
          fi
          selected="$(cd control && python3 scripts/preview.py select-commit --ref origin/master)"
          if [[ "$selected" != "$control_sha" ]]; then
            echo "master advanced to untested control revision ${selected}; refusing stale candidate promotion." >&2
            exit 1
          fi
          unexpected_paths="$(git -C control diff --name-only "$control_sha..origin/master" | grep -vxF 'website/preview.json' || true)"
          if [[ -n "$unexpected_paths" ]]; then
            echo "Skipped manifest commits changed release inputs:" >&2
            echo "$unexpected_paths" >&2
            exit 1
          fi
          expected_build_id="$(python3 control/scripts/preview.py candidate-build-id \
            --upstream-sha "$upstream_sha" \
            --control-sha "$control_sha" \
            --run-id "$BUILD_RUN_ID" \
            --run-attempt "$candidate_attempt")"
          if [[ "$expected_build_id" != "$build_id" ]]; then
            echo "Candidate build ID does not match its run identity." >&2
            exit 1
          fi

          {
            echo "UPSTREAM_SHA=$upstream_sha"
            echo "CONTROL_SHA=$control_sha"
            echo "BUILD_ID=$build_id"
            echo "REPLAY_TREE=$replay_tree"
            echo "BASE_VERSION=$base_version"
            echo "PROTOCOL=$protocol"
            echo "ENDPOINT_GENERATION=$endpoint_generation"
            echo "RELEASE_VERSION=$release_version"
            echo "ASSET_NAMES_JSON=$asset_names_json"
            echo "ARTIFACT_NAME=$artifact_name"
            echo "INSTALLER_ASSET_NAME=$installer"
          } >> "$GITHUB_ENV"
          {
            echo "build_id=$build_id"
            echo "base_version=$base_version"
            echo "release_version=$release_version"
            echo "asset_names_json=$asset_names_json"
            echo "artifact_name=$artifact_name"
            echo "installer_asset_name=$installer"
          } >> "$GITHUB_OUTPUT"

      - name: Verify and publish stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          zip="${ARTIFACT_NAME}.zip"
          checksum="${zip}.sha256"
          installer="${INSTALLER_ASSET_NAME}"
          installer_checksum="${installer}.sha256"
          portable_keys=(
            linux-x86_64
            linux-aarch64
            macos-x86_64
            macos-aarch64
          )
          portable_assets=()
          declare -A tested_portable_digests=()
          for key in "${portable_keys[@]}"; do
            asset="$(jq -er --arg key "$key" \
              '.[$key] | strings | select(length > 0)' <<<"$ASSET_NAMES_JSON")"
            if [[ "$asset" == */* || "$asset" == *\\* || "$asset" == .* ]]; then
              echo "Invalid portable release asset name for ${key}: ${asset}" >&2
              exit 1
            fi
            portable_assets+=("$asset")
            sha256sum --check "${asset}.sha256"
            tested_portable_digests["$key"]="sha256:$(sha256sum "$asset" | awk '{print $1}')"
          done
          if [[ "$(printf '%s\n' "${portable_assets[@]}" | sort -u | wc -l)" != "${#portable_assets[@]}" ]]; then
            echo "Portable release asset names are not unique." >&2
            exit 1
          fi
          sha256sum --check "$checksum"
          sha256sum --check "$installer_checksum"
          zip_digest="sha256:$(sha256sum "$zip" | awk '{print $1}')"
          installer_digest="sha256:$(sha256sum "$installer" | awk '{print $1}')"

          tag="v${RELEASE_VERSION}"

          verify_tag_target() {
            local tag_sha
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
            if [[ "$tag_sha" != "$CONTROL_SHA" ]]; then
              echo "Tag ${tag} points to ${tag_sha}, expected ${CONTROL_SHA}." >&2
              exit 1
            fi
          }

          ensure_tag_target() {
            # Create the lightweight tag first so release creation never decides
            # its target. A pre-existing tag returns an error and is verified below.
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              --field ref="refs/tags/${tag}" \
              --field sha="$CONTROL_SHA" >/dev/null 2>&1; then
              :
            fi
            verify_tag_target
          }

          verify_asset_shape() {
            local release_json="$1"
            local name="$2"
            local count
            local state
            local digest
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
            state="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .state' <<<"$release_json")"
            digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            if [[ "$count" != "1" || "$state" != "uploaded" || \
                  ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Release asset ${name} is missing, duplicated, incomplete, or has no SHA-256 digest." >&2
              exit 1
            fi
          }

          verify_asset_matches() {
            local release_json="$1"
            local name="$2"
            local expected_digest="$3"
            local digest
            digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            if [[ "$digest" != "$expected_digest" ]]; then
              echo "Release asset ${name} does not match the selected candidate." >&2
              exit 1
            fi
          }

          verify_release() {
            local release_json="$1"
            if [[ "$(jq -r .draft <<<"$release_json")" != "false" || \
                  "$(jq -r .prerelease <<<"$release_json")" != "false" || \
                  "$(jq -r '.immutable // false' <<<"$release_json")" != "true" || \
                  "$(jq -r .name <<<"$release_json")" != "Herdr Extended v${RELEASE_VERSION} (Herdr v${BASE_VERSION})" || \
                  "$(jq '.assets | length' <<<"$release_json")" != "6" ]]; then
              echo "Release ${tag} is not the expected immutable published stable release." >&2
              exit 1
            fi
            verify_asset_shape "$release_json" "$zip"
            verify_asset_shape "$release_json" "$installer"
            for asset in "${portable_assets[@]}"; do
              verify_asset_shape "$release_json" "$asset"
            done
          }

          echo "Release notes: https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md" > RELEASE_NOTES.md

          release_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_matches="$(jq -c --arg tag "$tag" '[.[][] | select(.tag_name == $tag)]' <<<"$release_pages")"
          release_count="$(jq 'length' <<<"$release_matches")"
          if [[ "$release_count" -gt 1 ]]; then
            echo "Multiple releases unexpectedly use tag ${tag}." >&2
            exit 1
          fi

          release_json=""
          if [[ "$release_count" == "1" ]]; then
            release_json="$(jq -c '.[0]' <<<"$release_matches")"
            if [[ "$(jq -r .draft <<<"$release_json")" == "true" ]]; then
              echo "Existing draft release ${tag} is preserved; refusing promotion." >&2
              exit 1
            elif [[ "$(jq -r '.immutable // false' <<<"$release_json")" != "true" ]]; then
              echo "Existing mutable release ${tag} is preserved; refusing promotion." >&2
              exit 1
            fi
          fi

          if [[ -n "$release_json" ]]; then
            verify_tag_target
            verify_release "$release_json"
            echo "Verified existing immutable release ${tag}."
          else
            ensure_tag_target
            gh release create "$tag" \
              "${ARTIFACT_NAME}.zip" \
              "${INSTALLER_ASSET_NAME}" \
              "${portable_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Herdr Extended v${RELEASE_VERSION} (Herdr v${BASE_VERSION})" \
              --notes-file RELEASE_NOTES.md \
              --latest

            verify_tag_target
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
            if [[ "$(jq -r '.immutable // false' <<<"$release_json")" != "true" ]]; then
              echo "Release ${tag} is not immutable; preserving tag and release and refusing manifest publication." >&2
              exit 1
            fi
            verify_release "$release_json"
          fi

          verify_asset_matches "$release_json" "$zip" "$zip_digest"
          verify_asset_matches "$release_json" "$installer" "$installer_digest"
          for key in "${portable_keys[@]}"; do
            asset="$(jq -er --arg key "$key" '.[$key]' <<<"$ASSET_NAMES_JSON")"
            verify_asset_matches "$release_json" "$asset" "${tested_portable_digests[$key]}"
          done

          built_at="$(jq -r .published_at <<<"$release_json")"
          if [[ ! "$built_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
            echo "Release ${tag} has no stable publication timestamp." >&2
            exit 1
          fi

          canonical_dir="$RUNNER_TEMP/herdr-win-published-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$canonical_dir"
          download_args=(
            release download "$tag"
            --repo "$GITHUB_REPOSITORY"
            --pattern "$zip"
            --pattern "$installer"
            --dir "$canonical_dir"
          )
          for asset in "${portable_assets[@]}"; do
            download_args+=(--pattern "$asset")
          done
          gh "${download_args[@]}"
          published_zip_digest="sha256:$(sha256sum "$canonical_dir/$zip" | awk '{print $1}')"
          published_installer_digest="sha256:$(sha256sum "$canonical_dir/$installer" | awk '{print $1}')"
          api_zip_digest="$(jq -r --arg name "$zip" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
          api_installer_digest="$(jq -r --arg name "$installer" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
          if [[ "$published_zip_digest" != "$api_zip_digest" || \
                "$published_installer_digest" != "$api_installer_digest" ]]; then
            echo "Downloaded immutable release assets do not match GitHub's recorded digests." >&2
            exit 1
          fi
          declare -A published_shas=(
            [windows-x86_64]="${published_zip_digest#sha256:}"
            [windows-x86_64-installer]="${published_installer_digest#sha256:}"
          )
          for key in "${portable_keys[@]}"; do
            asset="$(jq -er --arg key "$key" '.[$key]' <<<"$ASSET_NAMES_JSON")"
            published_digest="sha256:$(sha256sum "$canonical_dir/$asset" | awk '{print $1}')"
            api_digest="$(jq -r --arg name "$asset" \
              '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            if [[ "$published_digest" != "$api_digest" ]]; then
              echo "Downloaded immutable release asset ${asset} does not match GitHub's recorded digest." >&2
              exit 1
            fi
            published_shas["$key"]="${published_digest#sha256:}"
          done
          jq -n \
            --arg linux_x86_64 "${published_shas[linux-x86_64]}" \
            --arg linux_aarch64 "${published_shas[linux-aarch64]}" \
            --arg macos_x86_64 "${published_shas[macos-x86_64]}" \
            --arg macos_aarch64 "${published_shas[macos-aarch64]}" \
            --arg windows_x86_64 "${published_shas[windows-x86_64]}" \
            --arg windows_installer "${published_shas[windows-x86_64-installer]}" \
            '{
              "linux-x86_64": $linux_x86_64,
              "linux-aarch64": $linux_aarch64,
              "macos-x86_64": $macos_x86_64,
              "macos-aarch64": $macos_aarch64,
              "windows-x86_64": $windows_x86_64,
              "windows-x86_64-installer": $windows_installer
            }' > "$GITHUB_WORKSPACE/release-assets/published-sha256.json"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "built_at=${built_at}" >> "$GITHUB_OUTPUT"
          echo "zip_sha=${published_zip_digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "installer_sha=${published_installer_digest#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Generate preview update manifest
        id: manifest
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BUILT_AT: ${{ steps.release.outputs.built_at }}
        run: |
          set -euo pipefail
          notes="$GITHUB_WORKSPACE/release-assets/RELEASE_NOTES.md"
          shas="$GITHUB_WORKSPACE/release-assets/published-sha256.json"
          cd "$GITHUB_WORKSPACE/control"
          git fetch --no-tags origin master
          git checkout --force -B manifest-publish origin/master
          generator="$GITHUB_WORKSPACE/control/scripts/preview.py"
          if ! git merge-base --is-ancestor "$CONTROL_SHA" HEAD; then
            echo "Selected control revision ${CONTROL_SHA} is no longer on master." >&2
            exit 1
          fi
          selected="$(python3 "$generator" select-commit --ref HEAD)"
          if [[ "$selected" != "$CONTROL_SHA" ]]; then
            echo "master advanced to untested control revision ${selected}; refusing stale manifest publication." >&2
            exit 1
          fi
          unexpected_paths="$(git diff --name-only "$CONTROL_SHA..HEAD" | grep -vxF 'website/preview.json' || true)"
          if [[ -n "$unexpected_paths" ]]; then
            echo "Skipped manifest commits changed release inputs:" >&2
            echo "$unexpected_paths" >&2
            exit 1
          fi

          python3 "$generator" manifest \
            --output website/preview.json \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --build-id "$BUILD_ID" \
            --commit "$UPSTREAM_SHA" \
            --built-at "$BUILT_AT" \
            --base-version "$BASE_VERSION" \
            --protocol "$PROTOCOL" \
            --endpoint-generation "$ENDPOINT_GENERATION" \
            --notes "$notes" \
            --sha-file "$shas" \
            --release-version "$RELEASE_VERSION" \
            --retain 30

          asset_keys='["linux-aarch64","linux-x86_64","macos-aarch64","macos-x86_64","windows-x86_64","windows-x86_64-installer"]'
          jq -e \
            --arg build_id "$BUILD_ID" \
            --arg commit "$UPSTREAM_SHA" \
            --arg base_version "$BASE_VERSION" \
            --arg release_version "$RELEASE_VERSION" \
            --argjson protocol "$PROTOCOL" \
            --argjson endpoint_generation "$ENDPOINT_GENERATION" \
            --arg tag "$TAG" \
            --argjson names "$ASSET_NAMES_JSON" \
            --argjson asset_keys "$asset_keys" \
            --slurpfile shas "$shas" \
            --arg prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/" \
            'def valid_digest:
               type == "string" and test("^[0-9a-f]{64}$");
             def valid_asset_group:
               type == "object"
               and has("windows-x86_64")
               and ((keys - $asset_keys) | length == 0)
               and .["windows-x86_64"].format == "zip"
               and ((has("windows-x86_64-installer") | not)
                    or .["windows-x86_64-installer"].format == "nsis")
               and ([to_entries[] | .value.sha256] | all(valid_digest))
               and ([.["linux-x86_64"], .["linux-aarch64"],
                     .["macos-x86_64"], .["macos-aarch64"]]
                    | map(select(. != null)) | all(has("format") | not));
             .channel == "preview"
             and .prerelease == false
             and .release_version == $release_version
             and .build_id == $build_id
             and .commit == $commit
             and .base_version == $base_version
             and .protocol == $protocol
             and .endpoint_generation == $endpoint_generation
             and (.assets | keys == $asset_keys)
             and (.builds[$build_id].assets | keys == $asset_keys)
             and .builds[$build_id].assets == .assets
             and .builds[$build_id].release_version == $release_version
             and .builds[$build_id].prerelease == false
             and .builds[$build_id].endpoint_generation == $endpoint_generation
             and ([$asset_keys[] as $key
                   | .assets[$key].url == ($prefix + $tag + "/" + $names[$key])
                     and .assets[$key].sha256 == $shas[0][$key]] | all)
             and ([.assets, (.builds[]?.assets)] | all(valid_asset_group))
             and ([.assets[]?, (.builds[$build_id].assets[]?)] | all(.url | startswith($prefix)))' \
            website/preview.json >/dev/null

          if git diff --quiet -- website/preview.json; then
            echo "Preview manifest already points at ${BUILD_ID}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_paths="$(git diff --name-only)"
          untracked_paths="$(git ls-files --others --exclude-standard)"
          if [[ "$changed_paths" != "website/preview.json" || -n "$untracked_paths" ]]; then
            echo "Manifest generation changed paths outside website/preview.json." >&2
            git status --short >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/preview.json
          staged_paths="$(git diff --cached --name-only)"
          unstaged_paths="$(git diff --name-only)"
          untracked_paths="$(git ls-files --others --exclude-standard)"
          if [[ "$staged_paths" != "website/preview.json" || -n "$unstaged_paths" || -n "$untracked_paths" ]]; then
            echo "Only website/preview.json may be committed by release promotion." >&2
            git status --short >&2
            exit 1
          fi
          git commit -m "docs: update preview manifest"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish preview update manifest
        if: steps.manifest.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          if [[ "$(jq -r '.immutable // false' <<<"$release_json")" != "true" ]]; then
            echo "Release ${TAG} is not immutable; refusing to publish an update manifest." >&2
            exit 1
          fi

          cd control
          if [[ "$(git show -s --format=%s HEAD)" != "docs: update preview manifest" || \
                "$(git diff --name-only HEAD^..HEAD)" != "website/preview.json" ]]; then
            echo "Generated manifest commit does not have the expected one-file shape." >&2
            exit 1
          fi
          parent="$(git rev-parse HEAD^)"
          remote_head="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [[ "$remote_head" != "$parent" ]]; then
            echo "master changed during manifest publication; refusing to rebase generated state." >&2
            exit 1
          fi
          git -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' \
            push origin HEAD:master

  verify-update-feed:
    name: Verify published update feed
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BUILD_ID: ${{ needs.publish.outputs.build_id }}
      BASE_VERSION: ${{ needs.publish.outputs.base_version }}
      RELEASE_VERSION: ${{ needs.publish.outputs.release_version }}
      ASSET_NAMES_JSON: ${{ needs.publish.outputs.asset_names_json }}
      ARTIFACT_NAME: ${{ needs.publish.outputs.artifact_name }}
      INSTALLER_ASSET_NAME: ${{ needs.publish.outputs.installer_asset_name }}
    steps:
      - name: Confirm updater sees the published build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Stop-BoundedProcessTree {
            param([Parameter(Mandatory = $true)][Diagnostics.Process] $Process)
            $descendants = [Collections.Generic.List[Diagnostics.Process]]::new()
            $snapshotError = $null
            try {
              $entries = @(Get-CimInstance Win32_Process -Property ProcessId, ParentProcessId -OperationTimeoutSec 5)
              $seen = [Collections.Generic.HashSet[uint32]]::new()
              $pending = [Collections.Generic.Queue[uint32]]::new()
              [void] $seen.Add([uint32] $Process.Id)
              $pending.Enqueue([uint32] $Process.Id)
              while ($pending.Count -gt 0) {
                $parent = $pending.Dequeue()
                foreach ($entry in $entries) {
                  $childProcessId = [uint32] $entry.ProcessId
                  if ([uint32] $entry.ParentProcessId -eq $parent -and $seen.Add($childProcessId)) {
                    $pending.Enqueue($childProcessId)
                    try {
                      $descendant = [Diagnostics.Process]::GetProcessById([int] $childProcessId)
                      [void] $descendant.Handle
                      $descendants.Add($descendant)
                    } catch {
                      # The descendant already reached terminal state.
                    }
                  }
                }
              }
            } catch {
              $snapshotError = $_
            }
            $taskkill = Join-Path $env:SystemRoot "System32\taskkill.exe"
            $taskkillFailed = $false
            $cleanup = Start-Process -FilePath $taskkill -ArgumentList @("/PID", $Process.Id, "/T", "/F") -PassThru -NoNewWindow
            try {
              if (-not $cleanup.WaitForExit(10000)) {
                $cleanup.Kill()
                [void] $cleanup.WaitForExit(5000)
                $taskkillFailed = $true
              } elseif ($cleanup.ExitCode -ne 0) {
                $taskkillFailed = $true
              }
            } finally {
              $cleanup.Dispose()
            }
            $owned = @($Process) + @($descendants)
            try {
              foreach ($ownedProcess in $owned) {
                if (-not $ownedProcess.HasExited) {
                  try {
                    $ownedProcess.Kill($true)
                  } catch {
                    if (-not $ownedProcess.HasExited) {
                      throw
                    }
                  }
                }
              }
              $timer = [Diagnostics.Stopwatch]::StartNew()
              foreach ($ownedProcess in $owned) {
                $remaining = 10000 - [int] $timer.ElapsedMilliseconds
                if ($remaining -le 0 -or -not $ownedProcess.WaitForExit($remaining)) {
                  throw "owned process tree did not terminate within its 10000 ms confirmation deadline"
                }
              }
            } finally {
              foreach ($descendant in $descendants) {
                $descendant.Dispose()
              }
            }
            if ($null -ne $snapshotError) {
              throw "could not snapshot the owned process tree before cleanup: $snapshotError"
            }
            if ($taskkillFailed) {
              Write-Warning "taskkill did not complete cleanly; the captured process tree required bounded fallback cleanup"
            }
          }

          function Invoke-BoundedProcess {
            param(
              [Parameter(Mandatory = $true)][string] $FilePath,
              [string[]] $Arguments = @(),
              [int] $TimeoutMilliseconds = 180000
            )
            $startInfo = [Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $FilePath
            $startInfo.UseShellExecute = $false
            foreach ($argument in $Arguments) {
              [void] $startInfo.ArgumentList.Add($argument)
            }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            try {
              if (-not $process.Start()) {
                throw "could not start $FilePath"
              }
              if (-not $process.WaitForExit($TimeoutMilliseconds)) {
                Stop-BoundedProcessTree -Process $process
                throw "$FilePath exceeded its $TimeoutMilliseconds ms process deadline"
              }
              if ($process.ExitCode -ne 0) {
                throw "$FilePath failed with exit code $($process.ExitCode)"
              }
            } finally {
              $process.Dispose()
            }
          }

          function Invoke-BoundedCaptured {
            param(
              [Parameter(Mandatory = $true)][string] $FilePath,
              [string[]] $Arguments = @(),
              [int] $TimeoutMilliseconds = 60000
            )
            $startInfo = [Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $FilePath
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            foreach ($argument in $Arguments) {
              [void] $startInfo.ArgumentList.Add($argument)
            }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            try {
              if (-not $process.Start()) {
                throw "could not start $FilePath"
              }
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              if (-not $process.WaitForExit($TimeoutMilliseconds)) {
                Stop-BoundedProcessTree -Process $process
                throw "$FilePath exceeded its $TimeoutMilliseconds ms process deadline"
              }
              $output = ($stdout.GetAwaiter().GetResult() + $stderr.GetAwaiter().GetResult()).Trim()
              if ($process.ExitCode -ne 0) {
                throw "$FilePath failed with exit code $($process.ExitCode)`: $output"
              }
              return $output
            } finally {
              $process.Dispose()
            }
          }

          function Wait-Condition {
            param(
              [Parameter(Mandatory = $true)][scriptblock] $Condition,
              [Parameter(Mandatory = $true)][string] $Description,
              [int] $TimeoutMilliseconds = 30000
            )
            $timer = [Diagnostics.Stopwatch]::StartNew()
            while ($timer.ElapsedMilliseconds -lt $TimeoutMilliseconds) {
              if (& $Condition) {
                return
              }
              Start-Sleep -Milliseconds 100
            }
            throw "$Description did not reach terminal state within $TimeoutMilliseconds ms"
          }

          $manifestUrl = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/master/website/preview.json"
          $manifest = $null
          $manifestAttempts = 60
          for ($attempt = 1; $attempt -le $manifestAttempts; $attempt++) {
            try {
              $manifest = Invoke-RestMethod -Uri $manifestUrl -Headers @{ "Cache-Control" = "no-cache" } -TimeoutSec 30
            } catch {
              $manifest = $null
            }
            if ($null -ne $manifest -and [string]$manifest.build_id -eq $env:BUILD_ID) {
              Write-Host "public preview manifest advanced to $env:BUILD_ID on attempt $attempt of $manifestAttempts"
              break
            }
            if ($attempt -eq $manifestAttempts) {
              throw "release $env:RELEASE_VERSION is published, but the public preview manifest did not advance to $env:BUILD_ID within the bounded cache-propagation window; rerun only the failed jobs for this workflow run and do not dispatch promotion again"
            }
            Start-Sleep -Seconds 10
          }

          $asset = $manifest.assets.'windows-x86_64'
          $installerAsset = $manifest.assets.'windows-x86_64-installer'
          $assetNames = $env:ASSET_NAMES_JSON | ConvertFrom-Json
          $releasePrefix = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/"
          $releaseTag = "v$env:RELEASE_VERSION"
          $archiveName = [string] $assetNames.PSObject.Properties['windows-x86_64'].Value
          $installerName = [string] $assetNames.PSObject.Properties['windows-x86_64-installer'].Value
          if ($null -eq $asset -or [string] $asset.format -cne "zip" -or
              $archiveName -cne "$($env:ARTIFACT_NAME).zip" -or
              [string] $asset.url -cne "$releasePrefix$releaseTag/$archiveName" -or
              [string] $asset.sha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw "published preview manifest has no valid fork Windows ZIP asset"
          }
          if ($null -eq $installerAsset -or [string] $installerAsset.format -cne "nsis" -or
              $installerName -cne $env:INSTALLER_ASSET_NAME -or
              [string] $installerAsset.url -cne "$releasePrefix$releaseTag/$installerName" -or
              [string] $installerAsset.sha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw "published preview manifest has no valid fork Windows installer asset"
          }
          foreach ($target in @('linux-x86_64', 'linux-aarch64', 'macos-x86_64', 'macos-aarch64')) {
            $portableAsset = $manifest.assets.PSObject.Properties[$target].Value
            $portableName = [string] $assetNames.PSObject.Properties[$target].Value
            if ($null -eq $portableAsset -or [string]::IsNullOrWhiteSpace($portableName) -or
                [string] $portableAsset.url -cne "$releasePrefix$releaseTag/$portableName" -or
                [string] $portableAsset.sha256 -cnotmatch '^[0-9a-f]{64}$' -or
                $portableAsset.PSObject.Properties.Name -contains 'format') {
              throw "published preview manifest has no valid $target executable"
            }
            $portablePath = Join-Path $env:RUNNER_TEMP $portableName
            Invoke-WebRequest -Uri ([string] $portableAsset.url) -OutFile $portablePath -TimeoutSec 120
            $portableActual = (Get-FileHash -LiteralPath $portablePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($portableActual -cne [string] $portableAsset.sha256) {
              throw "published $target executable digest does not match the preview manifest"
            }
          }
          $archive = Join-Path $env:RUNNER_TEMP "$($env:ARTIFACT_NAME).zip"
          $installer = Join-Path $env:RUNNER_TEMP $env:INSTALLER_ASSET_NAME
          Invoke-WebRequest -Uri ([string] $asset.url) -OutFile $archive -TimeoutSec 120
          Invoke-WebRequest -Uri ([string] $installerAsset.url) -OutFile $installer -TimeoutSec 120
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne [string] $asset.sha256) {
            throw "published Windows ZIP digest does not match the preview manifest"
          }
          $installerActual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installerActual -cne [string] $installerAsset.sha256) {
            throw "published Windows installer digest does not match the preview manifest"
          }
          $stage = Join-Path $env:RUNNER_TEMP "herdr-win-update-check"
          Expand-Archive -LiteralPath $archive -DestinationPath $stage
          $env:HERDR_HOME = Join-Path $env:RUNNER_TEMP "herdr-win-update-home"
          $env:HERDR_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "herdr-win-update-install"
          Remove-Item Env:HERDR_SOCKET_PATH, Env:HERDR_CLIENT_SOCKET_PATH -ErrorAction SilentlyContinue
          $output = Invoke-BoundedCaptured -FilePath (Join-Path $stage "herdr.exe") -Arguments @("update")
          $expected = "already up to date ($env:RELEASE_VERSION)"
          if ($output -notlike "*$expected*") {
            throw "updater did not confirm the published fork build: $output"
          }

          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\Herdr"
          $arpKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Herdr Win"
          if ((Test-Path -LiteralPath $installRoot) -or (Test-Path -LiteralPath $arpKey)) {
            throw "public-feed installer gate requires a clean runner"
          }
          try {
            Invoke-BoundedProcess -FilePath $installer -Arguments @("/S")
            Wait-Condition -Description "managed install" -Condition {
              (Test-Path -LiteralPath (Join-Path $installRoot "state\active")) -and
                (Test-Path -LiteralPath $arpKey)
            }
            $active = [IO.File]::ReadAllText((Join-Path $installRoot "state\active"), [Text.UTF8Encoding]::new($false, $true))
            if ($active -cne "herdr-pointer-v1`nbuild_id=$env:BUILD_ID`n") {
              throw "published installer selected an unexpected managed build"
            }
            $managed = Join-Path $installRoot "bin\herdr.exe"
            $version = Invoke-BoundedCaptured -FilePath $managed -Arguments @("--version")
            if ($version -cne "herdr-ext $env:RELEASE_VERSION (Herdr $env:BASE_VERSION)") {
              throw "published installer returned unexpected managed version: $version"
            }
            $managedUpdate = Invoke-BoundedCaptured -FilePath $managed -Arguments @("update")
            if ($managedUpdate -notlike "*$expected*") {
              throw "managed updater did not confirm the published fork build: $managedUpdate"
            }
            Invoke-BoundedProcess -FilePath (Join-Path $installRoot "uninstall.exe") -Arguments @("/S", "/REMOVE_SETTINGS")
            Wait-Condition -Description "managed uninstall" -Condition {
              -not (Test-Path -LiteralPath $installRoot) -and -not (Test-Path -LiteralPath $arpKey)
            }
          } finally {
            $uninstaller = Join-Path $installRoot "uninstall.exe"
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              try {
                Invoke-BoundedProcess -FilePath $uninstaller -Arguments @("/S", "/REMOVE_SETTINGS")
              } catch {
                Write-Warning $_
              }
            }
          }
          if ((Test-Path -LiteralPath $installRoot) -or (Test-Path -LiteralPath $arpKey)) {
            throw "published installer gate left managed state behind"
          }
